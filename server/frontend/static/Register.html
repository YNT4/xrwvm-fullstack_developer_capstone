
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Dealerships</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-light bg-info px-4">
    <a class="navbar-brand" href="/">Dealerships</a>
  </nav>

  <main class="container mt-5" style="max-width: 500px;">
    <h2 class="mb-4">Register</h2>

    <form id="registerForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input id="firstName" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input id="lastName" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password"
               class="form-control" required>
      </div>

      <p id="message" role="alert"></p>

      <button type="submit" class="btn btn-primary">
        Register
      </button>
    </form>

    <p class="mt-3">
      Already have an account?
      <a href="/login">Login</a>
    </p>
  </main>

  <script>
    function getCookie(name) {
      const cookies = document.cookie.split(";");

      for (const cookie of cookies) {
        const item = cookie.trim();

        if (item.startsWith(name + "=")) {
          return decodeURIComponent(
            item.substring(name.length + 1)
          );
        }
      }

      return "";
    }

    document.getElementById("registerForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = document.getElementById("message");
        message.textContent = "";

        const data = {
          userName: document.getElementById("username").value,
          firstName: document.getElementById("firstName").value,
          lastName: document.getElementById("lastName").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        };

        try {
          const response = await fetch("/djangoapp/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken")
            },
            credentials: "same-origin",
            body: JSON.stringify(data)
          });

          const result = await response.json();

          if (response.status === 201) {
            window.location.href = "/login";
          } else {
            message.className = "text-danger";
            message.textContent =
              result.error || "Registration failed.";
          }
        } catch (error) {
          message.className = "text-danger";
          message.textContent = "Unable to connect to server.";
        }
      });
  </script>
</body>
</html>

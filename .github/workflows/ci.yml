
name: Fullstack Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Linter
        run: |
          flake8 server/djangoapp \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JavaScript Linter
        run: npm install --no-save --no-package-lock eslint@8

      - name: Run Linter
        run: |
          npx eslint server/database/app.js \
            --no-eslintrc \
            --env node,es2021 \
            --parser-options '{"ecmaVersion":2021}' \
            --rule 'no-undef:error' \
            --rule 'no-unexpected-multiline:error'

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Django dependencies
        working-directory: ./server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django project
        working-directory: ./server
        run: python manage.py check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Express dependencies
        working-directory: ./server/database
        run: npm install --no-audit --no-fund

      - name: Check Express syntax
        working-directory: ./server/database
        run: node --check app.js

      - name: CI completed
        run: echo "Fullstack Capstone CI completed successfully"
